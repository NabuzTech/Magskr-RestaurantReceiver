    <path d="M24 37V25C24 10 35 0 50 0C65 0 76 10 76 25V37"
          stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <rect x="10" y="34" width="80" height="68" rx="16" fill="#FFFFFF" stroke="#DCEBFF" stroke-width="5"/>
    <circle cx="50" cy="63" r="8" fill="#1768E8"/>
    <path d="M50 70V82" stroke="#1768E8" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
